{% extends "base.html" %}

{% block content %}
  <div class="jumbotron">
    <div class="container">
      <h1>
        {% trans %}Challenges{% endtrans %}
      </h1>
    </div>
  </div>

  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% include "components/errors.html" %}
      </div>
    </div>

    <div 
      x-data="ChallengeBoard" 
      @load-challenges.window="loadChallenges()" 
      @load-challenge.window="loadChallenge($event.detail)"
    >
      <div
          x-ref="challengeWindow" id="challenge-window" class="modal fade" tabindex="-1" role="dialog" x-data=""
          x-html="$store.challenge.data.view"
      ></div>

      <div x-show="!loaded">
        <div class="min-vh-50 d-flex align-items-center">
          <div class="text-center w-100">
            <i class="fas fa-circle-notch fa-spin fa-3x fa-fw spinner"></i>
          </div>
        </div>
      </div>

      <div x-show="loaded">
        <template x-for="(category, idx) in getCategories()" :key="idx">
          <div class="pt-5">
            <div class="category-header mb-3">
              <h3 x-text="category"></h3>
            </div>

            <div class="category-challenges d-flex flex-column">
              <div class="challenges-row row">
                <template x-for="(c, idx) in getChallenges(category)" :key="c.id">
                  <div class="col-sm-6 col-md-4 col-lg-3 my-3">
                    <button
                        class="challenge-button btn btn-dark w-100 h-100"
                        :class="[
                          c.solved_by_me ? 'challenge-solved' : '',
                          ...c.tags.map((tag) => `tag-${tag.value.replace(/ /g, '-')}`),
                        ];"
                        :value="c.id" @click="loadChallenge(c.id)"
                    >

                      <div class="challenge-inner my-2 text-start px-2">
                        <h4 x-text="c.name" class="fw-bold mb-3 text-white"></h4>
                        <template x-if="c.difficulty">
                          <span class="badge border mb-2 p-2 fs-6"
                                :class="{
                                  'border-success text-success': c.difficulty.toLowerCase() === 'easy',
                                  'border-warning text-warning': c.difficulty.toLowerCase() === 'medium',
                                  'border-danger text-danger': ['hard', 'insane'].includes(c.difficulty.toLowerCase()),
                                  'border-secondary text-secondary': !['easy', 'medium', 'hard', 'insane'].includes(c.difficulty.toLowerCase())
                                }">
                            <span x-text="c.difficulty"></span>
                          </span>
                        </template>
                        <template x-if="c.author">
                          <div class="text-muted small mb-2 text-truncate">
                            <i class="fa-solid fa-user me-1"></i> <span x-html="c.author"></span>
                          </div>
                        </template>
                        <hr style="border-top: 1px solid #4a1f1f; opacity: 1;" class="my-3" />
                        <div class="d-flex justify-content-between align-items-end">
                          <div>
                            <small class="text-uppercase fw-bold" style="color: #6c757d; font-size: 0.7em; letter-spacing: 1px;">Reward</small>
                            <br>
                            <span class="fs-4 fw-bold text-white" x-text="c.value"></span>
                            <span class="text-muted fw-bold ms-1" style="font-size: 0.9em;">PTS</span>
                            <i class="fa-solid fa-trophy text-danger ms-1"></i>
                          </div>
                          <div>
                            <span class="text-muted">
                              <i class="fa-solid fa-user-friends me-1"></i> <span x-text="c.solves"></span>
                            </span>
                          </div>
                        </div>
                      </div>
                    </button>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </template>
      </div>
    </div>
  </div>
{% endblock %}

{% block scripts %}
  {{ Assets.js("assets/js/challenges.js") }}
{% endblock %}
